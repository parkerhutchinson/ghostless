name: codename
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.0+2

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  characters: ^1.4.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_scene: ^0.24.6
  flutter_svg: ^2.5.0
  http: ^1.6.0
  image: ^4.13.1
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.1.0
  mysql1: ^0.23.0
  path_provider: ^2.1.6
  postgres: ^3.6.0
  supabase: ^2.16.5
  sync_engine:
    path: packages/sync_engine
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  vector_math: ^2.4.4
  window_manager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The 3D model turning on the sign-in screen (SignInModel).
  assets:
    - assets/scene/

  # Fragment shaders (compiled at build time).
  shaders:
    # Colors the sign-in screen's 3D scene from the background color.
    - shaders/light_map.frag

  # Inter 4.1 (https://github.com/rsms/inter, SIL OFL 1.1: assets/fonts/OFL.txt),
  # bundled so the sandboxed app works offline. Set app-wide in buildAppTheme().
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
